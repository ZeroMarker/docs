name: Deploy mdBook site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set weekly cache key
        run: echo "CARGO_CACHE_WEEK=$(date -u +%G-%V)" >> "$GITHUB_ENV"

      - name: Cache Cargo downloads and installed tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          # Rotate the cache weekly so unpinned tools can keep receiving updates.
          key: cargo-tools-${{ runner.os }}-${{ env.CARGO_CACHE_WEEK }}
          restore-keys: |
            cargo-tools-${{ runner.os }}-

      - name: Install mdBook tools
        run: |
          rustup update stable
          cargo install --locked mdbook
          cargo install --locked mdbook-summarizer

      - name: Generate SUMMARY.md
        run: |
          mdbook-summarizer --src src --auto-readme
          test -s src/SUMMARY.md
          git diff --check

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with mdBook
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
