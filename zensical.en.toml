[project]
site_name = "Personal Notes"
site_url = "https://zeromarker.github.io/docs/en/"
site_description = "Learning notes and references."
site_author = "notes"
repo_url = "https://github.com/ZeroMarker/docs"
repo_name = "ZeroMarker/docs"
edit_uri = "edit/main/docs-en/"
docs_dir = "docs-en"
site_dir = "site/en"
use_directory_urls = true

[project.theme]
variant = "classic"
language = "en"
features = [
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Follow system preference"

[project.plugins.tags]

[project.extra]
alternate = [
  { name = "中文", link = "/docs/", lang = "zh" },
  { name = "English", link = "/docs/en/", lang = "en" },
]
