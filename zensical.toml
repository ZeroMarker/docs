[project]
site_name = "个人笔记"
site_url = "https://zeromarker.github.io/docs/"
site_description = "各类学习笔记与记录。"
site_author = "notes"
repo_url = "https://github.com/ZeroMarker/docs"
repo_name = "ZeroMarker/docs"
edit_uri = "edit/main/docs/"
use_directory_urls = true

[project.theme]
variant = "classic"
language = "zh"
features = [
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "跟随系统设置"

[project.plugins.tags]
